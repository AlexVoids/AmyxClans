name: Verify and publish tested release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify checked artifacts and PHP syntax
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          find src extras tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r 'foreach(glob("release/*.phar") as $f){$p=new Phar($f);if($p->getSignature()["hash_type"]!=="SHA-256")throw new Exception($f);echo basename($f)," verified\n";}'
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag="v2.0.0"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --draft --title "AmyxClans ${tag#v}" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release edit "$tag" --draft=false
