# AmyXClans 1.4.0
# Основные настройки механик. Все названия окон, кнопок и сообщений
# находятся в texts.yml. После изменения используйте /clanadmin reload.
#
# Название клана поддерживает цветовые коды §0-§9, §a-§f, жирный §l и сброс §r.
# Код §k и остальные форматные коды запрещены. Длина считается без разрешённых кодов.
#
# Значки взяты из font/glyph_E2.png ресурс-пака InMine:
# U+E2C0 и U+E2D0-U+E2D6 — всего 8 значков.

config-version: 6
create-cost: 10000
allow-colored-clan-names: true
clan-name-min-length: 3
clan-name-max-length: 16

# Отображение выбранного значка в ChatPerms:
# без значка: [Клан]
# со значком: [значок Клан]
show-icon-in-chat-tag: true
clan-icon-name-separator: ' '
member-limits:
- 20
- 30
- 40
- 50
member-limit-upgrade-cost: 10000
home-cost: 10000
home-limits:
- 3
- 5
- 10
home-limit-upgrade-costs:
  '5': 5000
  '10': 10000
max-channels: 3
clan-icon-cost: 10000
# Смена названия в магазине клана, оплата из казны.
clan-rename-cost: 5000
clan-icons:
  icon_1:
    name: Звезда
    symbol: 
  icon_2:
    name: Череп
    symbol: 
  icon_3:
    name: Щит
    symbol: 
  icon_4:
    name: Мечи
    symbol: 
  icon_5:
    name: Кирка
    symbol: 
  icon_6:
    name: Колба
    symbol: 
  icon_7:
    name: Талисман
    symbol: 
  icon_8:
    name: Демон
    symbol: 
max-custom-roles: 10
invite-lifetime: 86400
rating:
  kill-weight: 10
  death-weight: 3
  member-weight: 5

# Дополнительные параметры автоматически дополняют старый конфиг при обновлении.
minimum-playtime-seconds: 1200
role-name-max-length: 24
history-limit: 10000
style:
  accent: '§5'
  text: '§f'
  prefix: '§5[Кланы] §f'
features:
  regions: true
  wars: true
  siege: true
  chat: true
levels:
  maximum: 5
  xp-per-level: 1000
  win-xp: 300
  kill-xp: 25
  participation-xp: 20
  activity-xp: 50
  activity-seconds: 3600
  kill-pair-cooldown: 300
ranking:
  initial: 0
  allow-negative: false
  join: 2
  win: 40
  loss: -40
  technical-loss: -30
  draw: 0
region-levels:
  1: {count: 3, size: 25}
  2: {count: 4, size: 30}
  3: {count: 6, size: 35}
  4: {count: 8, size: 40}
  5: {count: 10, size: 50}
region-expansion-prices:
  2: 10000
  4: 20000
  6: 40000
  8: 80000
  10: 160000
regions:
  op-bypass: true
  allowed-worlds: []
  denied-worlds: []
  world-borders: {}
chat:
  format: '&5[Клан] &5({role}) &f{player}: &f{message}'
  cooldown-seconds: 2
war:
  minimum-level: 2
  minimum-regions: 4
  team-sizes: [3, 5, 10, 15]
  request-seconds: 86400
  collect-seconds: 600
  prepare-seconds: 300
  fight-seconds: 1800
  siege-seconds: 1800
  siege-timeout: defenders
  both-incomplete: technical-both
  technical-fine: 10000
  kill-same-ip-xp: false
  totem-slowness: 1
  siege-transfer-region: false
snapshot:
  blocks-per-tick: 2048
  maximum-volume: 2000000
forms:
  title-prefix: '§5AmyxCraft §f| '
  page-size: 10
