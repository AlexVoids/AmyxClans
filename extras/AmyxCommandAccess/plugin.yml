name: AmyxCommandAccess
main: Amyx\CommandAccess\Main
version: 1.0.1
api: 5.0.0
author: AlexVoids
description: Белый список команд игроков для набора плагинов Amyx
softdepend: [AmyXClans, SimpleAuth, AmyxCommand, AmyxEconomy, AmyxSpawn, AmyxMine, AmyxMarkets, AmyBuilderGuard, AmyxBuildSession, ChatPerms]
commands:
  login:
    description: Вход через защищённую форму
    permission: amyxcommandaccess.auth
  register:
    description: Регистрация через защищённую форму
    permission: amyxcommandaccess.auth
  emailcode:
    description: Восстановление доступа и настройка почты
    permission: amyxcommandaccess.auth
permissions:
  amyxcommandaccess.auth:
    default: true
